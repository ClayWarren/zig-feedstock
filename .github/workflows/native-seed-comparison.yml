name: Native seed comparison (fork only)
on:
  push:
    branches: [codex/windows-arm64-seed-comparison]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'ClayWarren/zig-feedstock'
    runs-on: windows-11-arm
    timeout-minutes: 60
    env:
      PIXI_CACHE_DIR: C:\arm64-comparison-cache
      UPLOAD_PACKAGES: 'False'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify native runner
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'A native Windows ARM64 runner is required'
          }
          New-Item -ItemType Directory -Force evidence | Out-Null
          (Get-Date).ToUniversalTime().ToString('o') | Set-Content evidence/start.txt
          git rev-parse HEAD | Set-Content evidence/head.txt
      - uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0
        with:
          pixi-version: v0.79.0
          run-install: false
          cache: false
          post-cleanup: false
      - name: Build unchanged candidate and compare standard C smoke tests
        shell: pwsh
        run: |
          pixi install --manifest-path ci/native/pixi.toml -e zig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item ci/native/pixi.lock evidence/pixi.lock
          pixi run --manifest-path ci/native/pixi.toml -e zig python ci/native/compare_seeds.py
          exit $LASTEXITCODE
      - name: Collect Windows application error evidence
        if: always()
        shell: pwsh
        run: |
          $start = [datetime](Get-Content evidence/start.txt)
          $events = @(Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$start; Id=1000,1001} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match '(?i)zig.*\.exe' } |
            Select-Object TimeCreated, Id, ProviderName, Message)
          ConvertTo-Json -InputObject $events -Depth 4 | Set-Content evidence/windows-errors.json
          Write-Host "Retained $($events.Count) Zig application error events"
      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: seed-comparison-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: evidence/
