name: Source-built Windows validation (fork only)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: build
        options: [build, source, arm, cross, remaining, native, native-cross]
        description: Build variants or test retained ARM64 packages natively
      source_run:
        type: string
        default: ''
        description: Run containing the source-built ARM64 package artifact
      remaining_run:
        type: string
        default: ''
        description: Run containing ARM64-hosted cross package artifacts
      seed_run:
        type: string
        default: ''
        description: Optional retained x64 compiler run for cross-only acceptance

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'ClayWarren/zig-feedstock' && inputs.mode != 'native' && inputs.mode != 'native-cross'
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ inputs.mode == 'remaining' && fromJSON('[{"config":"win_arm64_cross_target_platform_win-64","host":"win-arm64"},{"config":"win_arm64_cross_target_platform_win-32","host":"win-arm64"},{"config":"win_64_cross_target_platform_win-32","host":"win-64"}]') || inputs.mode == 'source' && fromJSON('[{"config":"win_arm64_cross_target_platform_win-arm64","host":"win-arm64"},{"config":"win_64_cross_target_platform_win-64","host":"win-64"}]') || inputs.mode == 'cross' && fromJSON('[{"config":"win_64_cross_target_platform_win-arm64","host":"win-64"}]') || inputs.mode == 'arm' && fromJSON('[{"config":"win_64_cross_target_platform_win-arm64","host":"win-64"},{"config":"win_arm64_cross_target_platform_win-arm64","host":"win-arm64"}]') || fromJSON('[{"config":"win_64_cross_target_platform_win-arm64","host":"win-64"},{"config":"win_arm64_cross_target_platform_win-arm64","host":"win-arm64"},{"config":"win_64_cross_target_platform_win-64","host":"win-64"}]') }}
    env:
      UPLOAD_PACKAGES: 'False'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0
        with:
          pixi-version: v0.79.0
          run-install: false
          cache: false
          post-cleanup: false
      - name: Select exact local x64 compiler for cross acceptance
        if: inputs.seed_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_RUN: ${{ inputs.seed_run }}
          VALIDATION_MODE: ${{ inputs.mode }}
        run: |
          if ($env:VALIDATION_MODE -ne 'cross') { throw 'seed_run requires cross mode' }
          gh run download $env:SEED_RUN --repo ClayWarren/zig-feedstock --name "source-win_64_cross_target_platform_win-64-$env:SEED_RUN" --dir C:/seed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi exec rattler-index fs C:/seed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ci/select-local-seed.py
          exit $LASTEXITCODE
      - name: Build and test recipe without publishing
        shell: pwsh
        env:
          CONFIG: ${{ matrix.config }}
          HOST_PLATFORM: ${{ matrix.host }}
          SEED_RUN: ${{ inputs.seed_run }}
        run: |
          git rev-parse HEAD
          python recipe/testing/test_windows_shim_target.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $recipe = 'recipe'
          $variant = ".ci_support/$env:CONFIG.yaml"
          if ($env:SEED_RUN) { $recipe = 'C:/selected-recipe'; $variant = 'C:/selected-variant.yaml' }
          pixi run -e build rattler-build build --recipe $recipe -m $variant --build-platform win-64 --target-platform $env:HOST_PLATFORM --output-dir C:/bld --test native-and-emulated
          exit $LASTEXITCODE
      - name: Retain candidate packages
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-${{ matrix.config }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            C:/bld/win-arm64/*.conda
            C:/bld/win-64/*.conda
            C:/bld/noarch/*.conda
  native:
    if: github.repository == 'ClayWarren/zig-feedstock' && inputs.mode == 'native'
    runs-on: windows-11-arm
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0
        with:
          pixi-version: v0.79.0
          run-install: false
          cache: false
          post-cleanup: false
      - name: Install exact source-built candidate packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') { throw 'ARM64 OS required' }
          gh run download $env:SOURCE_RUN --repo ClayWarren/zig-feedstock --name "source-win_arm64_cross_target_platform_win-arm64-$env:SOURCE_RUN" --dir C:/candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem C:/candidate -Recurse -Filter *.conda | ForEach-Object FullName)
          if ($packages.Count -ne 4) { throw "Expected four ARM64 outputs, found $($packages.Count)" }
          pixi add --manifest-path ci/native-source/pixi.toml --no-install @packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi install --manifest-path ci/native-source/pixi.toml
          exit $LASTEXITCODE
      - name: Verify native compiler and consumers
        shell: pwsh
        run: |
          pixi run --manifest-path ci/native-source/pixi.toml python ci/native-source/accept.py
          exit $LASTEXITCODE
      - name: Retain native acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-native-acceptance-${{ github.run_id }}
          retention-days: 14
          path: |
            ci/native-source/pixi.toml
            ci/native-source/pixi.lock
  native-cross:
    if: github.repository == 'ClayWarren/zig-feedstock' && inputs.mode == 'native-cross'
    runs-on: windows-11-arm
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: [win-64, win-32]
    env:
      CROSS_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0
        with:
          pixi-version: v0.79.0
          run-install: false
          cache: false
          post-cleanup: false
      - name: Install exact implementation and cross package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          REMAINING_RUN: ${{ inputs.remaining_run }}
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') { throw 'ARM64 OS required' }
          gh run download $env:SOURCE_RUN --repo ClayWarren/zig-feedstock --name "source-win_arm64_cross_target_platform_win-arm64-$env:SOURCE_RUN" --dir C:/native-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh run download $env:REMAINING_RUN --repo ClayWarren/zig-feedstock --name "source-win_arm64_cross_target_platform_$env:CROSS_TARGET-$env:REMAINING_RUN" --dir C:/cross-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $implementation = @(Get-ChildItem C:/native-candidate -Recurse -Filter 'zig_impl_win-arm64-*.conda')
          $cross = @(Get-ChildItem C:/cross-candidate -Recurse -Filter "zig_$env:CROSS_TARGET-*.conda")
          if ($implementation.Count -ne 1 -or $cross.Count -ne 1) { throw 'Expected one implementation and one cross package' }
          $packages = @($implementation[0].FullName, $cross[0].FullName)
          Get-FileHash -Path $packages -Algorithm SHA256
          pixi add --manifest-path ci/native-cross/pixi.toml --no-install @packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi install --manifest-path ci/native-cross/pixi.toml
          exit $LASTEXITCODE
      - name: Execute native ARM64 wrappers for foreign targets
        shell: pwsh
        run: |
          pixi run --manifest-path ci/native-cross/pixi.toml python ci/native-cross/accept.py
          exit $LASTEXITCODE
      - name: Retain solve and install evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-cross-${{ matrix.target }}-${{ github.run_id }}
          retention-days: 14
          path: |
            ci/native-cross/pixi.toml
            ci/native-cross/pixi.lock
